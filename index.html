<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Atlantic - Atlantic Coast Tours</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fce7f3 0%, #fae8ff 50%, #f3e8ff 100%);
      color: #4a3e4d;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 860px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8);
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 480px) {
      .chat-container {
        height: 90vh;
        border-radius: 32px;
      }
    }

    .chat-header {
      padding: 1.25rem 1.5rem;
      background: rgba(255, 255, 255, 0.6);
      border-bottom: 1px dashed #f472b6;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .header-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
      color: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.35);
    }

    .header-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #831843;
      letter-spacing: -0.01em;
    }

    .header-text p {
      font-size: 0.78rem;
      color: #9d174d;
      font-weight: 500;
    }

    .chat-messages {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .bubble {
      padding: 0.85rem 1.1rem;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
    }

    .message.bot .bubble {
      background: #ffffff;
      color: #583f56;
      border-bottom-left-radius: 6px;
      border: 1px solid #fbcfe8;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.08);
    }

    .message.error .bubble {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .timestamp {
      font-size: 0.72rem;
      color: #9d174d;
      margin-top: 0.35rem;
      padding: 0 0.25rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .thinking {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.85rem 1.2rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: #ec4899;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .chat-input-area {
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.6);
      border-top: 1px dashed #f472b6;
    }

    .input-wrapper {
      display: flex;
      gap: 0.5rem;
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 999px;
      padding: 0.35rem 0.35rem 0.35rem 1.2rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.08);
    }

    .input-wrapper:focus-within {
      border-color: #ec4899;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.2);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #4a3e4d;
      font-size: 0.95rem;
    }

    input::placeholder {
      color: #d1a3be;
    }

    button {
      background: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.3rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <div class="header-icon">🌸</div>
      <div class="header-text">
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours Assistant</p>
      </div>
    </header>

    <main class="chat-messages" id="chat-messages">
      <div class="message bot">
        <div class="bubble">
          ✨ Hello! Welcome to Atlantic Coast Tours. How can I help you explore the beautiful west of Ireland today?
        </div>
      </div>
    </main>

    <footer class="chat-input-area">
      <form id="chat-form" class="input-wrapper">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask about tours, prices, or availability..." 
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </footer>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const CHAT_URL = "https://luas-class.kluxy.app/chat";
    const SYSTEM_PROMPT = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    // Fallback CSV data in case CORS blocks direct fetching from local file system
    const FALLBACK_CSV = `Tour Name,Location,Price (€),Slots Left,Duration
Cliffs of Moher Express,County Clare,45,12,Full Day
Connemara & Kylemore Abbey,County Galway,55,8,Full Day
Aran Islands Ferry & Tour,County Galway,65,5,Full Day
Ring of Kerry Scenic Drive,County Kerry,60,10,Full Day
Burren Hiking Adventure,County Clare,40,15,Half Day`;

    const chatMessages = document.getElementById("chat-messages");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      appendUserMessage(question);
      userInput.value = "";
      disableInput(true);

      const thinkingElem = appendThinkingMessage();
      scrollToBottom();

      let csvData = "";

      try {
        // Step 1: Try fetching live tour catalogue CSV
        const csvResponse = await fetch(CSV_URL);
        if (csvResponse.ok) {
          csvData = await csvResponse.text();
        } else {
          throw new Error("Network response was not ok");
        }
      } catch (err) {
        // Fallback to embedded data if CORS or network blocks fetch
        csvData = FALLBACK_CSV;
      }

      // Format live timestamp
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0];

      try {
        // Step 2: Send question and CSV to AI class brain
        const aiResponse = await fetch(CHAT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            system: SYSTEM_PROMPT,
            messages: [
              {
                role: "user",
                content: "Live data (CSV):\n" + csvData + "\n\nCustomer question: " + question
              }
            ]
          })
        });

        if (!aiResponse.ok) {
          throw new Error(`Failed to get response from assistant (Status: ${aiResponse.status})`);
        }

        const data = await aiResponse.json();
        removeMessage(thinkingElem);

        // Step 3: Show answer with timestamp line
        if (data && data.reply) {
          appendBotMessage(data.reply, `Data fetched live at ${timeString}`);
        } else {
          throw new Error("Received an unexpected response format.");
        }

      } catch (err) {
        removeMessage(thinkingElem);
        appendErrorMessage(`Error: ${err.message || "Something went wrong while processing your request."}`);
      } finally {
        disableInput(false);
        userInput.focus();
        scrollToBottom();
      }
    });

    function appendUserMessage(text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message user";
      msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      chatMessages.appendChild(msgDiv);
      scrollToBottom();
    }

    function appendBotMessage(replyText, timestampText) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message bot";
      
      const formattedReply = escapeHtml(replyText).replace(/\n/g, '<br>');
      
      msgDiv.innerHTML = `
        <div class="bubble">${formattedReply}</div>
        <div class="timestamp">${escapeHtml(timestampText)}</div>
      `;
      chatMessages.appendChild(msgDiv);
    }

    function appendErrorMessage(errorText) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message bot error";
      msgDiv.innerHTML = `<div class="bubble">${escapeHtml(errorText)}</div>`;
      chatMessages.appendChild(msgDiv);
    }

    function appendThinkingMessage() {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message bot";
      msgDiv.innerHTML = `
        <div class="bubble thinking">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;
      chatMessages.appendChild(msgDiv);
      return msgDiv;
    }

    function removeMessage(elem) {
      if (elem && elem.parentNode) {
        elem.parentNode.removeChild(elem);
      }
    }

    function disableInput(disabled) {
      userInput.disabled = disabled;
      sendBtn.disabled = disabled;
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
